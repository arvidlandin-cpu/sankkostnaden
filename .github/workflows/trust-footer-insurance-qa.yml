name: Trust footer and insurance QA

on:
  push:
    branches:
      - commercial/trust-footer-insurance-links-v1
      - ops/commercial-health-v2
    paths:
      - '.github/workflows/trust-footer-insurance-qa.yml'
      - 'components/SiteFooter.tsx'
      - 'pages/_app.tsx'
      - 'styles/global.css'
      - 'pages/forsakring/hemforsakring-hyresratt.tsx'
      - 'pages/forsakring/vad-kostar-hemforsakring.tsx'
      - 'pages/forsakring/jamfor-hemforsakring.tsx'
      - 'tests/trust-footer-insurance.spec.ts'
  workflow_dispatch:

jobs:
  trust-footer-insurance-qa:
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: 'http://127.0.0.1:3000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --progress=false
      - name: Existing checks
        run: |
          npm run check
          npm run check:integrity
      - name: Build static export
        run: npx next build
      - name: Check exported links
        run: npm run check:export
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 3000 --directory out > /tmp/trust-footer-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/forsakring/vad-kostar-hemforsakring/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/trust-footer-http.log
          exit 1
      - name: Run trust and insurance QA
        run: npx playwright test tests/trust-footer-insurance.spec.ts --project=chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trust-footer-insurance-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
