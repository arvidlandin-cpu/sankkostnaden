name: Sänk Kostnaden dygnsrapport

on:
  push:
    branches:
      - main
      - 'ops/autopilot-*'
      - 'ops/revenue-machine-*'
      - 'ops/sitewide-*'
      - 'ops/cancel-*'
    paths:
      - '.github/workflows/autopilot-control.yml'
      - 'autopilot/**'
      - 'AUTOPILOT.md'
      - 'scripts/autopilot-control.mjs'
      - 'scripts/google-organic-performance-report.mjs'
      - 'scripts/affiliate-revenue-report.mjs'
      - 'scripts/addrevenue-performance-report.mjs'
      - 'scripts/adtraction-performance-report.mjs'
      - 'scripts/partner-health.mjs'
      - 'scripts/lib/autopilotDecision.mjs'
      - 'scripts/lib/dailyReport.mjs'
      - 'scripts/verify-production-release.py'
      - 'scripts/lib/googleServiceAccount.mjs'
      - 'scripts/lib/googleOrganicPerformance.mjs'
      - 'scripts/lib/affiliateRevenue.mjs'
      - 'scripts/lib/addrevenuePerformance.mjs'
      - 'scripts/lib/adtractionPerformance.mjs'
      - 'tests/autopilot-control.test.mjs'
      - 'tests/daily-report.test.mjs'
      - 'tests/test_verify_production_release.py'
  workflow_dispatch:
  schedule:
    # One report at 09:00 Europe/Stockholm across summer/winter time.
    # GitHub may start scheduled jobs late; the gate selects the correct UTC slot.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'

permissions:
  contents: read
  checks: read

concurrency:
  group: sankkostnaden-autopilot
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.slot.outputs.run }}
    steps:
      - id: slot
        name: Select one Stockholm daily slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo('Europe/Stockholm'))
          slot = '0 7 * * *' if now.utcoffset().total_seconds() == 7200 else '0 8 * * *'
          run = os.environ['EVENT_NAME'] != 'schedule' or os.environ.get('SCHEDULE_CRON') == slot
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(run).lower() + '\n')
          print('Collect daily report' if run else 'Skip alternate DST slot; no data collection')
          PY
  decide:
    needs: schedule
    if: needs.schedule.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      ADTRACTION_API_TOKEN: ${{ secrets.ADTRACTION_API_TOKEN }}
      ADDREVENUE_API_TOKEN: ${{ secrets.ADDREVENUE }}
      GA4_MEASUREMENT_ID: 'G-E2XTJVY5EX'
      TARGET_HOSTNAME: 'sankkostnaden.se'
      REPORT_DAYS: '30'
      ATTRIBUTION_TRACKING_SINCE_ADTRACTION: '2026-10-06T14:24:38Z'
      ATTRIBUTION_TRACKING_SINCE_ADDREVENUE: '2026-10-06T14:37:00Z'
      AUTOPILOT_INPUT_ROOT: 'autopilot-input'
      AUTOPILOT_OUT_DIR: 'autopilot-report'
      SEO_REPORT_PATH: 'autopilot-input/live/production-verification.json'
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Validate autopilot and source logic
        run: |
          python3 -m unittest discover -s tests -p 'test_verify_production_release.py'
          node --test tests/autopilot-control.test.mjs
          node --test tests/google-organic-performance-report.test.mjs
          node --test tests/affiliate-revenue-report.test.mjs
          node --test tests/addrevenue-performance-report.test.mjs
          node --test tests/adtraction-performance-report.test.mjs
          node --test tests/partner-health.test.mjs
          node --test tests/daily-report.test.mjs

      - name: Verify the currently published main release and SEO
        continue-on-error: true
        run: |
          VERIFY_COMMIT="$(git ls-remote origin refs/heads/main | cut -f1)" python3 scripts/verify-production-release.py --mode production

      - name: Collect Google and GA4
        continue-on-error: true
        env:
          REPORT_OUT_DIR: autopilot-input/google
        run: node scripts/google-organic-performance-report.mjs

      - name: Collect Addrevenue performance
        continue-on-error: true
        env:
          REPORT_OUT_DIR: autopilot-input/addrevenue
          ATTRIBUTION_TRACKING_SINCE: ${{ env.ATTRIBUTION_TRACKING_SINCE_ADDREVENUE }}
        run: node scripts/addrevenue-performance-report.mjs

      - name: Collect Adtraction performance
        continue-on-error: true
        env:
          REPORT_OUT_DIR: autopilot-input/adtraction
          ATTRIBUTION_TRACKING_SINCE: ${{ env.ATTRIBUTION_TRACKING_SINCE_ADTRACTION }}
        run: node scripts/adtraction-performance-report.mjs

      - name: Collect partner health
        continue-on-error: true
        env:
          PARTNER_HEALTH_OUT_DIR: autopilot-input/partner-health
          PARTNER_HEALTH_STALE_DAYS: '45'
        run: node scripts/partner-health.mjs

      - name: Build guarded decision packet
        run: node scripts/autopilot-control.mjs

      - name: Publish the single daily report
        if: always()
        run: |
          if [ -f autopilot-report/daily-report.md ]; then
            cat autopilot-report/daily-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file='autopilot-report/daily-report.json';
          if(fs.existsSync(file)){
            const report=JSON.parse(fs.readFileSync(file,'utf8'));
            const sources=report.sources.map(source=>`${source.name}=${source.status}`).join(', ');
            const period=report.traffic.ga4Period;
            console.log(`::notice title=Dygnsrapportens källstatus::${sources}; production=${report.release.status}; verifiedCommit=${report.release.expectedCommit??'UNKNOWN'}; assets=${report.release.assetCount??'UNKNOWN'}; GA4period=${period?period.from+'..'+period.to:'UNKNOWN'}; organicSessions=${report.traffic.organicSessions??'UNKNOWN'}; organicPartnerClicks=${report.traffic.organicOutgoingPartnerClicks??'UNKNOWN'}; totalRevenue=${report.revenue.status}`);
          }
          JS

      - name: Upload autopilot decision packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sankkostnaden-autopilot
          path: |
            autopilot-report/
            autopilot-input/google/
            autopilot-input/affiliate/
            autopilot-input/addrevenue/
            autopilot-input/adtraction/
            autopilot-input/partner-health/
            autopilot-input/live/
          retention-days: 30
          if-no-files-found: ignore
