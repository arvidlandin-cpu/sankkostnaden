name: Priority SEO flow QA

on:
  push:
    branches:
      - commercial/priority-seo-flow-v1
    paths:
      - '.github/workflows/priority-seo-flow-qa.yml'
      - 'pages/forsakring/hemforsakring-bostadsratt.tsx'
      - 'pages/bredband/100-100.tsx'
      - 'components/IntentGuide.tsx'
      - 'styles/global.css'
      - 'tests/priority-seo-flow.spec.ts'
      - 'scripts/check-integrity.mjs'
  workflow_dispatch:

jobs:
  priority-seo-flow-qa:
    runs-on: ubuntu-latest
    env:
      QA_BASE_URL: 'http://127.0.0.1:3000'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --progress=false
      - name: Existing checks
        run: |
          npm run check
          npm run check:integrity
      - name: Build static export
        run: npx next build
      - name: Check exported links
        run: npm run check:export
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 3000 --directory out > /tmp/priority-seo-flow-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/forsakring/hemforsakring-bostadsratt/ >/dev/null && curl -fsS http://127.0.0.1:3000/bredband/100-100/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/priority-seo-flow-http.log
          exit 1
      - name: Run priority SEO flow QA
        run: npx playwright test tests/priority-seo-flow.spec.ts --project=chromium
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-seo-flow-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
