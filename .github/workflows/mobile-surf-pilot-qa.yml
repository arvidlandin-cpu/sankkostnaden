name: Mobile surf pilot QA

on:
  push:
    branches:
      - pilot/mobile-surf-prototype-2026-10-04
      - pilot/mobile-usability-invite-v1
    paths:
      - '.github/workflows/mobile-surf-pilot-qa.yml'
      - 'components/experiments/MobileSurfPilot.tsx'
      - 'components/AffiliateTracking.tsx'
      - 'pages/experiments/mobile-surf-pilot.tsx'
      - 'styles/MobileSurfPilot.module.css'
      - 'tests/mobile-surf-pilot.spec.ts'
      - 'experiments/mobile-surf-pilot/README.md'
      - 'scripts/check-integrity.mjs'
  workflow_dispatch:

jobs:
  pilot-qa:
    runs-on: ubuntu-latest
    env:
      ENABLE_MOBILE_SURF_PILOT: 'true'
      QA_BASE_URL: 'http://127.0.0.1:3000'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        run: npm install --progress=false

      - name: Existing integrity checks
        run: |
          npm run check
          npm run check:integrity

      - name: Build static export
        run: npx next build

      - name: Check generated links and anchors
        run: npm run check:export

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 3000 --directory out > /tmp/mobile-surf-pilot-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/experiments/mobile-surf-pilot/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mobile-surf-pilot-http.log
          exit 1

      - name: Run 360/390/430 pilot QA
        run: npx playwright test tests/mobile-surf-pilot.spec.ts --project=chromium

      - name: Upload pilot screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-surf-pilot-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
