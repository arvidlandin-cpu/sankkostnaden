name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install dependencies
        run: npm install --progress=false
      - name: Check internal routes
        run: npm run check
      - name: Build
        run: npx next build
      - name: Check generated links and anchors
        run: npm run check:export
