name: BrowserStack real iPhone QA

on:
  push:
    branches: [main, pilot/mobile-surf-prototype-2026-10-04]
    paths:
      - '.github/workflows/browserstack-real-iphone-qa.yml'
      - 'playwright.browserstack.config.ts'
      - 'tests/browserstack-real-ios.spec.ts'
      - 'browserstack.yml'
      - 'tests/browserstack-mobile-surf-pilot.spec.ts'
      - 'components/experiments/MobileSurfPilot.tsx'
      - 'pages/experiments/mobile-surf-pilot.tsx'
      - 'styles/MobileSurfPilot.module.css'
      - 'components/experiments/FirstYearCostCalculator.tsx'
      - 'pages/verktyg/forstaarskostnad.tsx'
      - 'pages/verktyg/forstaarskostnad-bredband.tsx'
      - 'styles/FirstYearCostCalculator.module.css'
      - 'pages/mobil/billigaste-mobilabonnemanget.tsx'
      - 'pages/bredband/billigaste-bredbandet.tsx'
      - 'pages/bredband/utan-bindningstid.tsx'
      - 'components/tools/SwitchCalendar.tsx'
      - 'pages/verktyg/byteskalender.tsx'
      - 'styles/SwitchCalendar.module.css'
      - 'pages/elavtal/byta-elavtal.tsx'
      - 'components/IntentGuide.tsx'
      - 'components/tools/FamilyMobileCost.tsx'
      - 'styles/FamilyMobileCost.module.css'
      - 'styles/TrafficTools.module.css'
      - 'pages/mobil/lonar-sig-familjeabonnemang.tsx'
      - 'pages/mobil/familjeabonnemang.tsx'
      - 'pages/app.tsx'
      - 'pages/verktyg/hushallskostnadskollen.tsx'
      - 'styles/App.module.css'
      - 'lib/costPrioritizer.ts'
      - 'components/tools/ElectricityCostCalculator.tsx'
      - 'styles/ElectricityCostCalculator.module.css'
      - 'pages/verktyg/elavtalskostnad.tsx'
      - 'pages/elavtal/jamfor-elavtal.tsx'
      - 'pages/elavtal/billigaste-elavtalet.tsx'
      - 'pages/elavtal/rorligt-elpris.tsx'
      - 'pages/forsakring/hemforsakring-bostadsratt.tsx'
      - 'pages/bredband/100-100.tsx'
      - 'components/SiteFooter.tsx'
      - 'pages/_app.tsx'
      - 'styles/global.css'
      - 'pages/forsakring/hemforsakring-hyresratt.tsx'
      - 'pages/forsakring/vad-kostar-hemforsakring.tsx'
      - 'pages/forsakring/jamfor-hemforsakring.tsx'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Public URL to test'
        required: false
        default: 'https://sankkostnaden.se'

jobs:
  real-iphone-qa:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      QA_BASE_URL: ${{ github.ref_name == 'pilot/mobile-surf-prototype-2026-10-04' && 'https://pilot-mobile-surf-prototype.sankkostnaden.pages.dev' || github.event.inputs.base_url || 'https://sankkostnaden.se' }}
      ENABLE_MOBILE_SURF_PILOT: ${{ github.ref_name == 'pilot/mobile-surf-prototype-2026-10-04' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify BrowserStack credentials
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "Missing BROWSERSTACK_USERNAME or BROWSERSTACK_ACCESS_KEY GitHub secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --progress=false

      - name: Wait for Cloudflare Pages pilot preview
        if: github.ref_name == 'pilot/mobile-surf-prototype-2026-10-04'
        run: |
          for i in {1..60}; do
            if curl -fsS "$QA_BASE_URL/experiments/mobile-surf-pilot/" | grep -q "Hur mycket surf"; then
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare pilot preview did not become ready in time."
          exit 1

      - name: Wait for Cloudflare Pages production deploy
        if: github.ref_name == 'main'
        run: |
          for i in {1..90}; do
            if curl -fsS "$QA_BASE_URL/verktyg/byteskalender/" | grep -q "När behöver du agera" && \
               curl -fsS "$QA_BASE_URL/mobil/lonar-sig-familjeabonnemang/" | grep -q "Lönar sig familjeabonnemang för er?" && \
               curl -fsS "$QA_BASE_URL/app/" | grep -q "Exakta belopp skickas inte" && \
               curl -fsS "$QA_BASE_URL/verktyg/forstaarskostnad-bredband/" | grep -q "KOSTNADSKALKYL" && \
               curl -fsS "$QA_BASE_URL/verktyg/elavtalskostnad/" | grep -q "Jämför två elavtal" && \
               curl -fsS "$QA_BASE_URL/forsakring/hemforsakring-bostadsratt/" | grep -q "Behöver jag bostadsrättstillägg" && \
               curl -fsS "$QA_BASE_URL/bredband/100-100/" | grep -q "Räkna om 100/100" && \
               curl -fsS "$QA_BASE_URL/forsakring/vad-kostar-hemforsakring/" | grep -q "Gör skyddskollen" && \
               curl -fsS "$QA_BASE_URL/" | grep -q "Affiliateinformation"; then
              exit 0
            fi
            sleep 2
          done
          echo "Cloudflare production deploy did not become ready in time."
          exit 1

      - name: Run real iPhone Safari QA
        run: |
          set +e
          if [ "${GITHUB_REF_NAME}" = "pilot/mobile-surf-prototype-2026-10-04" ]; then
            npx browserstack-node-sdk playwright test tests/browserstack-mobile-surf-pilot.spec.ts --config=playwright.browserstack.config.ts 2>&1 | tee /tmp/browserstack-qa.log
          else
            npm run qa:browserstack 2>&1 | tee /tmp/browserstack-qa.log
          fi
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ] && grep -q "Automate testing time expired" /tmp/browserstack-qa.log; then
            echo "::warning::BrowserStack Automate quota/time is exhausted. Treating this run as infrastructure-blocked rather than a product QA failure."
            exit 0
          fi

          exit "$status"
