name: BrowserStack real iPhone QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Public URL to test'
        required: false
        default: 'https://sankkostnaden.se'

jobs:
  real-iphone-qa:
    runs-on: ubuntu-latest
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      QA_BASE_URL: ${{ inputs.base_url || 'https://sankkostnaden.se' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify BrowserStack credentials
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "Missing BROWSERSTACK_USERNAME or BROWSERSTACK_ACCESS_KEY GitHub secrets."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --progress=false

      - name: Run real iPhone Safari QA
        run: npm run qa:browserstack
