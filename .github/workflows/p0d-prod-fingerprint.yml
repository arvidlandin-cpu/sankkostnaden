name: P0D independent live Pages asset identity

on:
  push:
    branches:
      - 'ops/p0d-prod-fingerprint-*'
    paths:
      - 'scripts/check-live-pages-assets.mjs'
      - '.github/workflows/p0d-prod-fingerprint.yml'
  workflow_dispatch:
    inputs:
      pages_preview_url:
        description: 'Exact successful Cloudflare Pages deployment preview URL'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual deployed page fingerprints, read-only
        env:
          SK_PAGES_PREVIEW_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.pages_preview_url || 'https://6b3fe37f.sankkostnaden.pages.dev/' }}
          SK_CUSTOM_DOMAIN_URL: 'https://sankkostnaden.se/'
        run: node scripts/check-live-pages-assets.mjs
