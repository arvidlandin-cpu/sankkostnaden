name: P0D independent live Pages asset identity

on:
  push:
    branches:
      - 'ops/p0d-prod-fingerprint-*'
    paths:
      - 'scripts/check-live-pages-assets.mjs'
      - '.github/workflows/p0d-prod-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare actual deployed page fingerprints, read-only
        env:
          SK_PAGES_PREVIEW_URL: 'https://86005561.sankkostnaden.pages.dev/'
          SK_CUSTOM_DOMAIN_URL: 'https://sankkostnaden.se/'
        run: node scripts/check-live-pages-assets.mjs
