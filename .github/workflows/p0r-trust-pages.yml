name: P0R focused trust and policy first-screen image review
on:
  pull_request:
    paths:
      - 'pages/affiliate.tsx'
      - 'pages/cookies.tsx'
      - 'pages/integritet.tsx'
      - 'pages/om.tsx'
      - 'pages/sa-jamfor-vi.tsx'
      - 'styles/TrustPages.module.css'
      - 'tests/p0r-trust-pages.spec.ts'
      - '.github/workflows/p0r-trust-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: |
          npm install --progress=false
          npm run check
          npm run check:integrity
          npx next build
          npm run check:export
      - run: npx playwright install --with-deps chromium
      - name: Serve proposed site
        run: |
          python3 -m http.server 3000 --directory out > /tmp/p0r-static-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Five real trust pages in phone and desktop at 100 percent zoom
        run: npx playwright test tests/p0r-trust-pages.spec.ts --project=chromium --workers=1
      - name: Preserve genuine 20 view screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0r-trust-page-visual-evidence
          path: |
            test-results/p0r-trust-page-evidence/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
