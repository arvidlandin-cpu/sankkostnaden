name: Check Compricer affiliate landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-compricer-link.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check current and home-insurance deeplink
        shell: bash
        run: |
          set -e
          current='https://at.compricer.se/t/t?a=1052530634&as=2111115937&t=2&tk=1'
          deep='https://at.compricer.se/t/t?a=1052530634&as=2111115937&t=2&tk=1&url=https%3A%2F%2Fwww.compricer.se%2Fforsakring%2Fhem%2F'
          echo "CURRENT_FINAL=$(curl -A 'Mozilla/5.0' -LsS -o /dev/null -w '%{url_effective}' "$current")"
          echo "DEEPLINK_FINAL=$(curl -A 'Mozilla/5.0' -LsS -o /dev/null -w '%{url_effective}' "$deep")"
