name: SEO release continuity (read-only)

on:
  push:
    branches: ['main', 'feat/kostnadskartan-*', 'ops/autopilot-daily-*', 'design/category-artwork-*', 'ux/journey-followups-*']
    paths:
      - 'tests/fixtures/seo-continuity-baseline.json'
      - 'tests/test_verify_production_release.py'
      - 'scripts/check-export.mjs'
      - 'scripts/verify-production-release.py'
      - 'pages/**'
      - 'components/**'
      - 'public/**'
      - 'styles/**'
      - '.github/workflows/seo-release-continuity.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification target (auto: main production, otherwise preview)'
        type: choice
        options: ['auto', 'production', 'preview']
        default: 'auto'
      preview_url:
        description: 'Optional real branch alias; otherwise discover immutable Pages URL'
        type: string
        required: false

permissions:
  contents: read
  checks: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      SEO_MODE: ${{ inputs.mode != '' && inputs.mode != 'auto' && inputs.mode || (github.ref_name == 'main' && 'production' || 'preview') }}
      SEO_PREVIEW_URL: ${{ inputs.preview_url }}
      SEO_REPORT_PATH: seo-continuity-report.json
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment reference selection
        run: python3 -m unittest discover -s tests -p 'test_verify_production_release.py'
      - name: Diagnose the currently published release before preview
        if: startsWith(github.ref_name, 'ux/journey-followups-')
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export VERIFY_COMMIT="$(git ls-remote origin refs/heads/main | cut -f1)"
          SEO_REPORT_PATH=published-release-diagnostic.json python3 scripts/verify-production-release.py --mode production
      - name: Verify actual deployed release and baseline metadata
        run: python3 scripts/verify-production-release.py
      - name: Publish bounded verification summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY_SUMMARY'
          import json
          import os
          from pathlib import Path
          report_path = Path(os.environ.get('SEO_REPORT_PATH', 'seo-continuity-report.json'))
          if report_path.is_file():
              report = json.loads(report_path.read_text())
              def safe(value, limit=200):
                  text = str(value if value is not None else 'unknown')
                  return text.replace('\n', ' ').replace('\r', ' ').replace('`', '').replace('<', '&lt;').replace('>', '&gt;')[:limit]
              checks = report.get('checks', [])
              metadata = [row for row in checks if row.get('kind') in ('production-metadata', 'preview-metadata')]
              failures = list(report.get('errors', []))
              failures.extend(error for row in checks if not row.get('kind', '').startswith('readiness-') for error in row.get('errors', []))
              failures.extend(error for asset in report.get('assets', []) for error in asset.get('errors', []))
              lines = ['## Read-only release verification',
                       '**Result:** ' + ('PASS' if report.get('passed') is True else 'FAIL'),
                       '- Target: ' + safe(report.get('mode')),
                       '- Expected commit: `' + safe(report.get('expectedCommit'), 64) + '`',
                       '- Immutable reference: ' + safe(report.get('referenceUrl')),
                       '- Verified at: ' + safe(report.get('verifiedAt')),
                       '- Metadata routes checked: ' + str(len(metadata)) + '/63',
                       '- Asset proofs: ' + str(len(report.get('assets', [])))]
              if failures:
                  lines += ['', 'Errors (first 12):'] + ['- ' + safe(error, 240) for error in failures[:12]]
                  if len(failures) > 12:
                      lines.append('- Additional errors are recorded in the JSON artifact.')
              lines += ['', 'This verifies HTTP metadata, discovery and release identity. It does not establish Google indexing or rankings.',
                        'Full machine-readable details: the seo-release-continuity artifact.']
              notice = ('passed=' + str(report.get('passed') is True).lower()
                        + '; mode=' + safe(report.get('mode'), 32)
                        + '; expectedCommit=' + safe(report.get('expectedCommit'), 64)
                        + '; metadata=' + str(len(metadata)) + '/63'
                        + '; assets=' + str(len(report.get('assets', [])))
                        + '; verifiedAt=' + safe(report.get('verifiedAt'), 64))
              # Escape workflow-command payload syntax; expose only the whitelist.
              notice = notice.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=Release verification::' + notice, flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
                  output.write('\n'.join(lines) + '\n')
          PY_SUMMARY
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-release-continuity-${{ github.run_id }}
          path: seo-continuity-report.json
          if-no-files-found: error
          retention-days: 14
