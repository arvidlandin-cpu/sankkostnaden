name: SEO release continuity (read-only)

on:
  push:
    branches: ['feat/kostnadskartan-*']
    paths:
      - 'tests/fixtures/seo-continuity-baseline.json'
      - 'scripts/check-export.mjs'
      - 'pages/**'
      - 'components/**'
      - '.github/workflows/seo-release-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify preview metadata and production discovery
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import datetime
          import json
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import urllib.robotparser
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser

          PREVIEW = 'https://feat-kostnadskartan-20261014.sankkostnaden.pages.dev'
          PROD = 'https://sankkostnaden.se'
          report = {'startedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                    'preview': PREVIEW, 'production': PROD, 'checks': [], 'errors': [],
                    'scope': 'HTTP accessibility, metadata continuity and discovery only; no evidence of Google indexing or rankings.'}

          class Metadata(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.titles, self.descriptions, self.canonicals, self.robots = [], [], [], []
                  self.in_title = False
                  self.title = ''
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'title':
                      self.in_title = True
                      self.title = ''
                  if tag == 'meta':
                      name = a.get('name', '').lower()
                      if name == 'description':
                          self.descriptions.append(a.get('content', ''))
                      if name in ('robots', 'googlebot', 'googlebot-news'):
                          self.robots.append(a.get('content', ''))
                  if tag == 'link' and 'canonical' in a.get('rel', '').lower().split():
                      self.canonicals.append(a.get('href', ''))
              def handle_data(self, data):
                  if self.in_title:
                      self.title += data
              def handle_endtag(self, tag):
                  if tag == 'title' and self.in_title:
                      self.titles.append(self.title.strip())
                      self.in_title = False

          def noindex(value):
              return bool(re.search(r'\bnoindex\b|(?:^|[\s,:;])none(?:$|[\s,;])', value, re.I))

          def fetch(url, timeout=15):
              row = {'url': url, 'status': None, 'errors': []}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'SankKostnaden-SEO-Continuity/1.0'})
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      row['status'] = response.status
                      row['finalUrl'] = response.geturl()
                      # Inspect only the relevant directive; never serialize headers/cookies.
                      directives = ','.join(response.headers.get_all('X-Robots-Tag', []))
                      body = response.read(5_000_001)
                      if len(body) > 5_000_000:
                          raise ValueError('Response exceeds 5 MB limit')
                      text = body.decode('utf-8-sig')
                      row['headerNoindex'] = noindex(directives)
                      if row['status'] != 200:
                          row['errors'].append('Expected HTTP 200')
                      return row, text
              except urllib.error.HTTPError as exc:
                  row['status'] = exc.code
                  row['errors'].append('HTTP request failed')
              except Exception as exc:
                  row['errors'].append('Fetch failed: ' + type(exc).__name__)
              return row, None

          def parse(body):
              meta = Metadata()
              meta.feed(body)
              meta.close()
              return meta

          def publish(row):
              report['checks'].append(row)
              print(json.dumps({'url': row['url'], 'status': row['status'], 'errors': row['errors']}, ensure_ascii=False), flush=True)

          def preview_check(page):
              row, body = fetch(PREVIEW + page['path'] + '?qa=1')
              row['kind'] = 'preview-metadata'
              if body is not None:
                  meta = parse(body)
                  row['observed'] = {'titles': meta.titles, 'descriptions': meta.descriptions, 'canonicals': meta.canonicals}
                  for key, actual in [('title', meta.titles), ('description', meta.descriptions), ('canonical', meta.canonicals)]:
                      if actual != [page[key]]:
                          row['errors'].append('Exact ' + key + ' mismatch (including missing/duplicate elements)')
                  if not row['headerNoindex']:
                      row['errors'].append('Preview requires X-Robots-Tag: noindex')
              return row

          try:
              baseline = json.loads(pathlib.Path('tests/fixtures/seo-continuity-baseline.json').read_text())
              pages = baseline['pages']
              if len(pages) != 63 or len({p['path'] for p in pages}) != 63:
                  raise ValueError('Expected 63 unique baseline routes')
              expected = next(p for p in pages if p['path'] == '/bredband/')['title']
              deadline = time.monotonic() + 180
              ready = False
              while time.monotonic() < deadline:
                  remaining = deadline - time.monotonic()
                  row, body = fetch(PREVIEW + '/bredband/?qa=1', timeout=min(15, max(.1, remaining)))
                  row['kind'] = 'preview-readiness'
                  ready = body is not None and row['status'] == 200 and parse(body).titles == [expected]
                  if not ready:
                      row['errors'].append('Preview has not served the exact baseline broadband title yet')
                  publish(row)
                  if ready:
                      break
                  remaining = deadline - time.monotonic()
                  if remaining > 0:
                      time.sleep(min(10, remaining))
              if not ready:
                  report['errors'].append('Preview readiness timed out after at most 180 seconds')
              # Readiness attempts are diagnostic; only the terminal outcome gates.
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  for row in pool.map(preview_check, pages):
                      publish(row)
              for path in ['/', '/bredband/100-100/', '/forsakring/hemforsakring-bostadsratt/', '/elavtal/kvartspris/']:
                  row, body = fetch(PROD + path + '?qa=1')
                  row['kind'] = 'production-indexability'
                  if body is not None:
                      meta = parse(body)
                      row['observedCanonical'] = meta.canonicals
                      if meta.canonicals != [PROD + path]:
                          row['errors'].append('Production must have exactly one self canonical')
                      if row['headerNoindex'] or any(noindex(value) for value in meta.robots):
                          row['errors'].append('Production must not have noindex in HTTP or HTML')
                  publish(row)
              row, body = fetch(PROD + '/robots.txt')
              row['kind'] = 'production-robots'
              if body is not None:
                  robot = urllib.robotparser.RobotFileParser()
                  robot.parse(body.splitlines())
                  for page in pages:
                      if not robot.can_fetch('Googlebot', PROD + page['path']):
                          row['errors'].append('Googlebot disallowed: ' + page['path'])
                  # Reject a catch-all exclusion even if an Allow exception masks it.
                  groups, agents, rules = [], [], []
                  for line in body.splitlines() + ['User-agent: __end__']:
                      clean = line.split('#', 1)[0].strip()
                      if ':' not in clean:
                          continue
                      key, value = (part.strip() for part in clean.split(':', 1))
                      if key.lower() == 'user-agent':
                          if rules:
                              groups.append((agents, rules))
                              agents, rules = [], []
                          agents.append(value.lower())
                      elif key.lower() in ('disallow', 'allow'):
                          rules.append((key.lower(), value))
                  for agents, rules in groups:
                      if ('*' in agents or 'googlebot' in agents) and any(k == 'disallow' and v in ('/', '/*') for k, v in rules):
                          row['errors'].append('Global crawler disallow found')
              publish(row)
              row, body = fetch(PROD + '/sitemap.xml')
              row['kind'] = 'production-sitemap'
              if body is not None:
                  tree = ET.fromstring(body)
                  locations = {node.text.strip() for node in tree.iter() if node.tag.split('}')[-1] == 'loc' and node.text}
                  missing = sorted(p['canonical'] for p in pages if p['canonical'] not in locations)
                  row['missingBaselineUrls'] = missing
                  if missing:
                      row['errors'].append('Sitemap missing ' + str(len(missing)) + ' baseline URLs')
              publish(row)
          except Exception as exc:
              report['errors'].append('Verifier exception: ' + type(exc).__name__ + ': ' + str(exc))
          finally:
              failures = [r for r in report['checks'] if r.get('kind') != 'preview-readiness' and r['errors']]
              report['passed'] = not report['errors'] and not failures
              report['finishedAt'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
              pathlib.Path('seo-continuity-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
              print('SEO continuity: ' + ('PASS' if report['passed'] else 'FAIL'), flush=True)
          sys.exit(0 if report['passed'] else 1)
          PY
      - name: Upload read-only verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-release-continuity-${{ github.run_id }}
          path: seo-continuity-report.json
          if-no-files-found: error
          retention-days: 14
